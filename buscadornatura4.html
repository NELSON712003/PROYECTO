<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔍 REFRICARGA - NATURA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 12px;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 720px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { font-size: 1.5rem; margin-bottom: 3px; }
        .header p { color: #a0aec0; font-size: 0.85rem; }

        .config-panel {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .config-panel h3 {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #63b3ed;
        }
        .input-group { margin-bottom: 8px; }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: #cbd5e0;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 0.85rem;
        }
        .input-group input:focus { outline: none; border-color: #63b3ed; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; }
        .btn-primary {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4299e1, #3182ce);
            color: white;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .btn-primary:disabled { background: #4a5568; cursor: not-allowed; }
        .btn-test {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #38a169, #2f855a);
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .scanner-section {
            background: rgba(255,255,255,0.06);
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: center;
            position: relative;
        }
        .scanner-section.active {
            border-color: #48bb78;
            background: rgba(72,187,120,0.08);
        }
        .field-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
        }
        .field-display .label {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .field-display .value {
            font-size: 1.3rem;
        }
        .scanner-input-wrap {
            position: relative;
            margin-bottom: 12px;
        }
        .scanner-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(0,0,0,0.4);
            color: #48bb78;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        .scanner-input:focus {
            outline: none;
            border-color: #48bb78;
            box-shadow: 0 0 15px rgba(72,187,120,0.3);
        }
        .scanner-hint {
            font-size: 0.75rem;
            color: #a0aec0;
            margin-top: 6px;
        }
        .last-scan {
            margin-top: 10px;
            padding: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            font-size: 0.8rem;
            color: #68d391;
        }

        .nav-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 12px;
        }
        .btn-nav {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a5568, #2d3748);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-nav:hover { transform: scale(1.08); }
        .btn-nav:active { transform: scale(0.95); }

        .mic-wrap {
            text-align: center;
        }
        .btn-mic {
            width: 80px; height: 80px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #e53e3e, #c53030);
            color: white; font-size: 1.8rem; cursor: pointer;
            transition: all 0.3s; box-shadow: 0 5px 20px rgba(229,62,62,0.4);
        }
        .btn-mic:hover { transform: scale(1.05); }
        .btn-mic.listening { animation: micPulse 1s infinite; background: linear-gradient(135deg, #38a169, #2f855a); }
        @keyframes micPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
        .mic-label { margin-top: 6px; color: #a0aec0; font-size: 0.75rem; }

        .status-bar {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .status-idle { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: #a0aec0; }
        .status-listen { background: rgba(229,62,62,0.15); border: 1px solid rgba(229,62,62,0.3); color: #feb2b2; animation: pulse 1.5s infinite; }
        .status-ok { background: rgba(72,187,120,0.15); border: 1px solid rgba(72,187,120,0.3); color: #9ae6b4; }
        .status-err { background: rgba(229,62,62,0.15); border: 1px solid rgba(229,62,62,0.3); color: #feb2b2; }
        .status-load { background: rgba(66,153,225,0.15); border: 1px solid rgba(66,153,225,0.3); color: #90cdf4; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

        .debug-panel {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .debug-header {
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #a0aec0;
            cursor: pointer;
        }
        .debug-body {
            max-height: 180px;
            overflow-y: auto;
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            line-height: 1.4;
        }
        .debug-line { margin-bottom: 3px; padding: 2px 5px; border-radius: 3px; }
        .debug-info { color: #90cdf4; }
        .debug-ok { color: #68d391; }
        .debug-err { color: #fc8181; }
        .debug-warn { color: #fbd38d; }

        .msg-box {
            padding: 10px; border-radius: 8px; margin-bottom: 10px;
            text-align: center; font-weight: 600; font-size: 0.85rem;
            display: none;
        }
        .msg-box.show { display: block; }
        .msg-ok { background: rgba(72,187,120,0.15); border: 1px solid rgba(72,187,120,0.3); color: #9ae6b4; }
        .msg-err { background: rgba(229,62,62,0.15); border: 1px solid rgba(229,62,62,0.3); color: #feb2b2; }
        .msg-info { background: rgba(66,153,225,0.15); border: 1px solid rgba(66,153,225,0.3); color: #90cdf4; }

        .search-section {
            background: rgba(255,255,255,0.04);
            border-radius: 12px; padding: 12px;
            margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.08);
        }
        .search-row { display: flex; gap: 6px; }
        .search-row input {
            flex: 1; padding: 11px 14px;
            border: 2px solid rgba(255,255,255,0.12); border-radius: 8px;
            background: rgba(0,0,0,0.25); color: #fff; font-size: 0.95rem;
        }
        .btn-search {
            padding: 11px 16px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #805ad5, #6b46c1);
            color: white; font-weight: bold; font-size: 0.85rem;
            cursor: pointer;
        }

        .results-section { margin-bottom: 10px; }
        .results-section h3 { font-size: 0.95rem; margin-bottom: 10px; color: #e2e8f0; }
        .result-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 14px;
            margin-bottom: 10px; animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
        .result-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .result-number { font-size: 1.2rem; font-weight: bold; color: #fbd38d; }
        .result-match { font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; background: rgba(251,211,141,0.12); color: #fbd38d; }
        .result-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .detail-box { background: rgba(0,0,0,0.2); border-radius: 6px; padding: 8px; text-align: center; }
        .detail-box .label { font-size: 0.65rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
        .detail-box .value { font-size: 1rem; font-weight: bold; color: #63b3ed; }
        .btn-found {
            width: 100%; padding: 10px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #38a169, #2f855a);
            color: white; font-weight: bold; font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-found:disabled { background: #4a5568; cursor: not-allowed; }
        .btn-found.deleting { background: linear-gradient(135deg, #dd6b20, #c05621); }

        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-right: 5px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .no-results { text-align: center; padding: 20px 10px; color: #718096; }
        .no-results .icon { font-size: 2rem; margin-bottom: 6px; }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.2rem; }
            .field-display .value { font-size: 1.1rem; }
            .scanner-input { font-size: 1.1rem; }
            .btn-nav { width: 50px; height: 50px; font-size: 1.2rem; }
            .btn-mic { width: 70px; height: 70px; font-size: 1.5rem; }
            .result-details { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 REFRICARGA - NATURA</h1>
            <p>MEDELLIN</p>
        </div>

        <div class="config-panel">
            <h3>⚙️ Configuración</h3>
            <div class="input-group">
                <label>🔗 URL del Script de Google Apps:</label>
                <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/AKfycbxPzFoIqtH5T3-nnweRmn0lDoI82RR8CkBsTr_vNwIMSAUtr3Vi5rNcQ0srcFBMJrEhUw/exec">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="input-group">
                    <label>📄 Nombre de la Hoja:</label>
                    <input type="text" id="sheetName" value="ciegos">
                </div>
                <div class="input-group">
                    <label>📊 Rango (columnas):</label>
                    <input type="text" id="rangeName" value="A:Z">
                </div>
            </div>
            <div class="btn-row">
                <button class="btn-test" onclick="probarConexion()">🔌 Probar</button>
                <button class="btn-primary" id="btnCargar" onclick="cargarDatos()">📥 Cargar Datos</button>
            </div>
        </div>

        <div class="debug-panel">
            <div class="debug-header" onclick="toggleDebug()">
                🐛 Consola de Depuración <span id="debugToggle">▼</span>
            </div>
            <div class="debug-body" id="debugBody">
                <div class="debug-line debug-info">Esperando acción...</div>
            </div>
        </div>

        <div id="statusBar" class="status-bar status-idle">🎤 Listo</div>
        <div id="msgBox" class="msg-box"></div>

        <div class="scanner-section" id="scannerSection">
            <div class="field-display" id="fieldDisplay">
                <div class="label">📍 Campo Activo</div>
                <div class="value" id="fieldName">Cargue datos primero</div>
            </div>

            <div class="scanner-input-wrap">
                <input 
                    type="text" 
                    id="scannerInput" 
                    class="scanner-input" 
                    placeholder="─── ESCANEAR CÓDIGO ───"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                >
            </div>
            <div class="scanner-hint">📲 Cualquier escáner infrarrojo, bluetooth o USB funciona automáticamente</div>
            <div class="last-scan" id="lastScan" style="display:none;"></div>
        </div>

        <div class="nav-section">
            <button class="btn-nav" onclick="prevColumn()" title="Columna anterior">⬅️</button>
            
            <div class="mic-wrap">
                <button id="btnMic" class="btn-mic" onclick="toggleVoice()" title="Presiona para hablar">🎤</button>
                <div class="mic-label" id="micLabel">Voz</div>
            </div>
            
            <button class="btn-nav" onclick="nextColumn()" title="Columna siguiente">➡️</button>
        </div>

        <div class="search-section">
            <div class="search-row">
                <input type="text" id="manualSearch" placeholder="Buscar número o últimos 4 dígitos..." onkeypress="if(event.key==='Enter') buscarManual()">
                <button class="btn-search" onclick="buscarManual()">🔍</button>
            </div>
        </div>

        <div class="results-section" id="resultsSection" style="display:none;">
            <h3>📋 Resultados Encontrados</h3>
            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        let sheetData = [];
        let headers = [];
        let recognition = null;
        let isListening = false;
        let scriptUrl = '';
        let sheetName = 'ciegos';
        let debugVisible = true;
        let activeColIndex = 0;
        let scannerTimer = null;

        function log(msg, type = 'info') {
            const body = document.getElementById('debugBody');
            const line = document.createElement('div');
            line.className = 'debug-line debug-' + type;
            const time = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
            line.textContent = `[${time}] ${msg}`;
            body.appendChild(line);
            body.scrollTop = body.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        function toggleDebug() {
            const body = document.getElementById('debugBody');
            const toggle = document.getElementById('debugToggle');
            debugVisible = !debugVisible;
            body.style.display = debugVisible ? 'block' : 'none';
            toggle.textContent = debugVisible ? '▼' : '▶';
        }

        window.onload = function() {
            log('Página cargada. Inicializando...', 'info');
            const savedUrl = localStorage.getItem('gs_scriptUrl');
            const savedSheet = localStorage.getItem('gs_sheetName');
            const savedRange = localStorage.getItem('gs_rangeName');
            if (savedUrl) { document.getElementById('scriptUrl').value = savedUrl; log('URL cargada', 'ok'); }
            if (savedSheet) { document.getElementById('sheetName').value = savedSheet; }
            if (savedRange) { document.getElementById('rangeName').value = savedRange; }
            initVoice();
            initScanner();
            log('Inicialización completa', 'ok');
        };

        document.getElementById('scriptUrl').addEventListener('change', e => {
            localStorage.setItem('gs_scriptUrl', e.target.value);
            log('URL guardada', 'ok');
        });
        document.getElementById('sheetName').addEventListener('change', e => localStorage.setItem('gs_sheetName', e.target.value));
        document.getElementById('rangeName').addEventListener('change', e => localStorage.setItem('gs_rangeName', e.target.value));

        function initScanner() {
            const input = document.getElementById('scannerInput');
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const code = input.value.trim();
                    if (code) processScan(code);
                    input.value = '';
                    return;
                }
                clearTimeout(scannerTimer);
                scannerTimer = setTimeout(() => {}, 100);
            });
            input.addEventListener('blur', function() {
                setTimeout(() => input.focus(), 50);
            });
            input.focus();
            document.addEventListener('click', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
                setTimeout(() => input.focus(), 50);
            });
            log('Escáner inicializado', 'ok');
        }

        async function processScan(code) {
            log('📟 CÓDIGO ESCANEADO: ' + code, 'info');
            if (!scriptUrl) {
                showMsg('⚠️ Primero carga los datos', 'err');
                return;
            }
            if (headers.length === 0) {
                showMsg('⚠️ Primero carga los datos', 'err');
                return;
            }
            const colName = headers[activeColIndex] || colLetra(activeColIndex);
            const colLetter = colLetra(activeColIndex);
            showStatus('⏳ Registrando en ' + colLetter + '...', 'load');
            log('Insertando en columna ' + colLetter, 'info');

            try {
                const result = await jsonpRequest(scriptUrl, {
                    action: 'insertCode',
                    sheet: sheetName,
                    col: activeColIndex + 1,
                    value: code
                });
                log('Respuesta insert: ' + JSON.stringify(result), 'info');

                if (result && result.success) {
                    const lastScanEl = document.getElementById('lastScan');
                    lastScanEl.style.display = 'block';
                    lastScanEl.innerHTML = '✅ Último registro: <b>' + code + '</b> → Celda <b>' + result.cell + '</b>';
                    showMsg('✅ Registrado en ' + result.cell + ': ' + code, 'ok');
                    showStatus('✅ Registrado en ' + result.cell, 'ok');
                    log('>>> ÉXITO: ' + result.message, 'ok');
                    const section = document.getElementById('scannerSection');
                    section.classList.add('active');
                    setTimeout(() => section.classList.remove('active'), 800);
                } else {
                    throw new Error((result && result.error) || 'Error desconocido');
                }
            } catch (err) {
                showMsg('❌ Error al registrar: ' + err.message, 'err');
                showStatus('❌ Error', 'err');
                log('>>> ERROR: ' + err.message, 'err');
            }
        }

        function updateFieldDisplay() {
            const fieldNameEl = document.getElementById('fieldName');
            if (headers.length === 0) {
                fieldNameEl.textContent = 'Cargue datos primero';
                return;
            }
            const name = headers[activeColIndex] || ('Columna ' + colLetra(activeColIndex));
            const letter = colLetra(activeColIndex);
            fieldNameEl.innerHTML = name + ' <span style="font-size:0.8rem;color:rgba(255,255,255,0.6)">(' + letter + ')</span>';
            log('Columna activa: ' + letter + ' - ' + name, 'info');
        }

        function nextColumn() {
            if (headers.length === 0) {
                showMsg('⚠️ Primero carga los datos', 'err');
                return;
            }
            activeColIndex = (activeColIndex + 1) % headers.length;
            updateFieldDisplay();
            document.getElementById('scannerInput').focus();
        }

        function prevColumn() {
            if (headers.length === 0) {
                showMsg('⚠️ Primero carga los datos', 'err');
                return;
            }
            activeColIndex = (activeColIndex - 1 + headers.length) % headers.length;
            updateFieldDisplay();
            document.getElementById('scannerInput').focus();
        }

        async function probarConexion() {
            const url = document.getElementById('scriptUrl').value.trim();
            if (!url) {
                showMsg('⚠️ Ingresa la URL', 'err');
                return;
            }
            log('Probando conexión...', 'info');
            showStatus('⏳ Probando...', 'load');
            try {
                const result = await jsonpRequest(url, { action: 'ping' });
                if (result && result.pong) {
                    showStatus('✅ Conexión OK', 'ok');
                    showMsg('✅ Conectado', 'ok');
                } else {
                    showStatus('❌ Error', 'err');
                    showMsg('❌ ' + (result.error || 'Error'), 'err');
                }
            } catch (err) {
                showStatus('❌ Sin conexión', 'err');
                showMsg('❌ ' + err.message, 'err');
            }
        }

        async function cargarDatos() {
            scriptUrl = document.getElementById('scriptUrl').value.trim();
            sheetName = document.getElementById('sheetName').value.trim() || 'ciegos';
            const rangeName = document.getElementById('rangeName').value.trim() || 'A:Z';

            if (!scriptUrl) {
                showMsg('⚠️ Ingresa la URL del Script', 'err');
                return;
            }

            log('Cargando datos...', 'info');
            showStatus('⏳ Cargando...', 'load');
            document.getElementById('btnCargar').disabled = true;

            try {
                const result = await jsonpRequest(scriptUrl, {
                    action: 'getData',
                    sheet: sheetName,
                    range: rangeName
                });

                if (result && result.error) throw new Error(result.error);
                if (!result || !result.data) throw new Error('Sin datos');

                sheetData = result.data;

                if (sheetData.length === 0) {
                    showStatus('⚠️ Hoja vacía', 'err');
                    return;
                }

                headers = sheetData[0];
                activeColIndex = 0;
                updateFieldDisplay();

                let celdasOcupadas = 0;
                for (let r = 1; r < sheetData.length; r++) {
                    for (let c = 0; c < sheetData[r].length; c++) {
                        const val = sheetData[r][c];
                        if (val !== '' && val !== null && val !== undefined && String(val).trim() !== '') {
                            celdasOcupadas++;
                        }
                    }
                }

                log('Encabezados: ' + headers.join(' | '), 'ok');
                log('Celdas ocupadas contadas: ' + celdasOcupadas, 'ok');

                showStatus('✅ ' + celdasOcupadas + ' celdas ocupadas (A:Z / 2:1000) | Columna: ' + colLetra(0), 'ok');
                showMsg('📊 ' + celdasOcupadas + ' celdas con datos cargadas', 'ok');

            } catch (err) {
                showStatus('❌ Error: ' + err.message, 'err');
                showMsg('❌ ' + err.message, 'err');
                log('ERROR: ' + err.message, 'err');
            } finally {
                document.getElementById('btnCargar').disabled = false;
            }
        }

        function jsonpRequest(baseUrl, params) {
            return new Promise((resolve, reject) => {
                const callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
                const queryParts = [];
                for (const key in params) {
                    queryParts.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));
                }
                queryParts.push('callback=' + callbackName);

                const url = baseUrl + (baseUrl.indexOf('?') >= 0 ? '&' : '?') + queryParts.join('&');
                log('JSONP: ' + url.substring(0, 120) + '...', 'info');

                const script = document.createElement('script');
                const timeout = setTimeout(() => {
                    cleanup();
                    reject(new Error('Timeout'));
                }, 15000);

                window[callbackName] = function(data) {
                    clearTimeout(timeout);
                    cleanup();
                    resolve(data);
                };

                function cleanup() {
                    delete window[callbackName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                }

                script.onerror = function() {
                    clearTimeout(timeout);
                    cleanup();
                    reject(new Error('Error de carga'));
                };

                script.src = url;
                document.head.appendChild(script);
            });
        }

        function initVoice() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                document.getElementById('btnMic').disabled = true;
                return;
            }
            recognition = new SR();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('btnMic').classList.add('listening');
                document.getElementById('micLabel').textContent = '🔴 Escuchando';
                showStatus('🎙️ Escuchando...', 'listen');
            };
            recognition.onend = () => {
                isListening = false;
                document.getElementById('btnMic').classList.remove('listening');
                document.getElementById('micLabel').textContent = 'Voz';
                showStatus('🎤 Listo', 'idle');
            };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const numeros = extraerNumeros(transcript);
                if (numeros.length > 0) {
                    const num = numeros[0];
                    document.getElementById('manualSearch').value = num;
                    buscarNumero(num);
                } else {
                    showStatus('⚠️ Sin números', 'err');
                }
            };
        }

        function toggleVoice() {
            if (!recognition) { showMsg('❌ No soportado', 'err'); return; }
            if (isListening) recognition.stop(); else recognition.start();
        }

        function extraerNumeros(texto) {
            const sinEspacios = texto.replace(/(\d)\s+(?=[\d])/g, '$1');
            return sinEspacios.match(/\d+/g) || [];
        }

        function buscarManual() {
            const val = document.getElementById('manualSearch').value.trim();
            if (!val) { showMsg('⚠️ Ingresa un número', 'err'); return; }
            buscarNumero(val);
        }

        function buscarNumero(numeroBuscado) {
            if (sheetData.length === 0) {
                showMsg('⚠️ Carga datos primero', 'err');
                return;
            }
            const resultados = [];
            const busquedaLimpia = numeroBuscado.replace(/\s/g, '');
            const esCorta = busquedaLimpia.length <= 4;
            const ultimos4 = busquedaLimpia.slice(-4);

            for (let r = 1; r < sheetData.length; r++) {
                const fila = sheetData[r];
                for (let c = 0; c < fila.length; c++) {
                    const celda = String(fila[c] || '').trim();
                    const celdaLimpia = celda.replace(/\s/g, '');
                    let coincide = false, tipo = '';
                    if (esCorta && celdaLimpia.length > 4) {
                        if (celdaLimpia.slice(-4) === ultimos4) { coincide = true; tipo = 'Últimos 4'; }
                    } else {
                        if (celdaLimpia === busquedaLimpia) { coincide = true; tipo = 'Exacta'; }
                        else if (celdaLimpia.includes(busquedaLimpia)) { coincide = true; tipo = 'Parcial'; }
                    }
                    if (coincide) {
                        resultados.push({
                            numero: celda,
                            colNombre: headers[c] || ('Col ' + colLetra(c)),
                            colLetra: colLetra(c),
                            filaNum: r + 1,        // Fila REAL de Google Sheets
                            filaIdx: r,
                            tipo: tipo,
                            colIdx: c
                        });
                    }
                }
            }
            mostrarResultados(resultados, numeroBuscado);
        }

        function colLetra(i) {
            let l = '';
            while (i >= 0) { l = String.fromCharCode(65 + (i % 26)) + l; i = Math.floor(i / 26) - 1; }
            return l;
        }

        function mostrarResultados(res, busqueda) {
            const container = document.getElementById('resultsContainer');
            const section = document.getElementById('resultsSection');
            if (res.length === 0) {
                container.innerHTML = '<div class="no-results"><div class="icon">🔍</div><div>"' + busqueda + '" no encontrado</div></div>';
                section.style.display = 'block';
                showStatus('❌ No encontrado', 'err');
                return;
            }
            let html = '';
            res.forEach((r, i) => {
                // ============================================================
                // CAMBIO: filaMostrada = filaReal - 1 (porque fila 1 = headers)
                // La fila REAL (r.filaNum) se sigue pasando a borrarCelda()
                // ============================================================
                const filaMostrada = r.filaNum - 1;
                
                html += '<div class="result-card" id="card-' + i + '">' +
                    '<div class="result-header"><div class="result-number">' + r.numero + '</div><div class="result-match">' + r.tipo + '</div></div>' +
                    '<div class="result-details">' +
                    '<div class="detail-box"><div class="label">Columna</div><div class="value">' + r.colNombre + '</div></div>' +
                    '<div class="detail-box"><div class="label">Línea</div><div class="value">' + filaMostrada + '</div></div>' +
                    '</div>' +
                    '<button class="btn-found" id="btnf-' + i + '" onclick="borrarCelda(' + r.filaNum + ',' + r.colIdx + ',' + i + ')">' +
                    '✅ ENCONTRADO - Borrar Línea ' + filaMostrada + ' (' + r.colLetra + ')</button></div>';
            });
            container.innerHTML = html;
            section.style.display = 'block';
            showStatus('✅ ' + res.length + ' resultado(s)', 'ok');
        }

        async function borrarCelda(filaNum, colIdx, cardIdx) {
            const btn = document.getElementById('btnf-' + cardIdx);
            btn.disabled = true;
            btn.classList.add('deleting');
            btn.innerHTML = '<span class="spinner"></span> Borrando...';
            const cellRef = colLetra(colIdx) + filaNum;
            const filaMostrada = filaNum - 1; // Para mensajes visuales
            
            try {
                const result = await jsonpRequest(scriptUrl, {
                    action: 'clearCell',
                    sheet: sheetName,
                    row: filaNum,
                    col: colIdx + 1
                });
                if (result && result.success) {
                    const card = document.getElementById('card-' + cardIdx);
                    card.style.transition = 'all 0.5s';
                    card.style.opacity = '0';
                    card.style.transform = 'translateX(80px)';
                    setTimeout(() => {
                        card.remove();
                        if (document.getElementById('resultsContainer').children.length === 0) {
                            document.getElementById('resultsSection').style.display = 'none';
                        }
                        cargarDatos();
                    }, 500);
                    showMsg('✅ Línea ' + filaMostrada + ' borrada', 'ok');
                } else {
                    throw new Error(result.error || 'Error');
                }
            } catch (err) {
                btn.disabled = false;
                btn.classList.remove('deleting');
                btn.innerHTML = '✅ ENCONTRADO - Borrar Línea ' + filaMostrada + ' (' + colLetra(colIdx) + ')';
                showMsg('❌ ' + err.message, 'err');
            }
        }

        function showStatus(texto, tipo) {
            const bar = document.getElementById('statusBar');
            bar.textContent = texto;
            bar.className = 'status-bar status-' + tipo;
        }
        function showMsg(texto, tipo) {
            const box = document.getElementById('msgBox');
            box.textContent = texto;
            box.className = 'msg-box msg-' + tipo + ' show';
            setTimeout(() => box.classList.remove('show'), 4000);
        }
    </script>
</body>
